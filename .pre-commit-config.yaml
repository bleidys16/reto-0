repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: .venv/Scripts/python.exe -m ruff check
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: .venv/Scripts/python.exe -m pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
